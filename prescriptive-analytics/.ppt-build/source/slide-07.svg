es</text></g><g transform="translate(686.5826771653543 402.0236220472441)  "><rect width="177.41732283464566" height="60.031496062992126" rx="0" fill="none" stroke="none" stroke-width="1.0" stroke-linejoin="round"/><text x="167.81889763779526" y="25.598425196850393" font-family="Roboto" font-size="16.0" text-anchor="end" fill="#000000">Jupiter is a gas giant and the biggest planet in the Solar System</text></g><g transform="translate(547.6692913385826 179.0) rotate(90.0 28.125984251968504 28.125984251968504) "><rect width="56.25196850393701" height="56.25196850393701" rx="0" fill="#EEEEEE" stroke="none" stroke-width="1.0" stroke-linejoin="round"/></g><g transform="translate(540.503937007874 363.755905511811) rotate(180.0 28.125984251968504 28.125984251968504) "><rect width="56.25196850393701" height="56.25196850393701" rx="0" fill="#EEEEEE" stroke="none" stroke-width="1.0" stroke-linejoin="round"/></g><g transform="translate(356.0787401574803 363.755905511811) rotate(-90.0 28.125984251968504 28.125984251968504) "><rect width="56.25196850393701" height="56.25196850393701" rx="0" fill="#EEEEEE" stroke="none" stroke-width="1.0" stroke-linejoin="round"/></g><g transform="translate(362.0472440944882 179.0)  "><rect width="56.25196850393701" height="56.25196850393701" rx="0" fill="#EEEEEE" stroke="none" stroke-width="1.0" stroke-linejoin="round"/></g><g transform="translate(460.67265091863516 166.86740157480315) scale(1.156998978710032 1.1569998420969525) translate(6525.139107611549 -431.68241469816275)"><g transform="translate(-6525.139107611549 462.7742782152231)  "><g transform="scale(0.0026246719160104987 0.0026246719160104987)"><path d="M442 0 C221 0 1 189 1 441 C1 662 221 819 442 819 L12288 819 C12540 819 12697 630 12697 441 C12729 158 12540 0 12288 0 Z" fill="#FFFFFF" stroke="none" stroke-width="381.0" /></g></g><g transform="translate(-6525.139107611549 449.70866141732284)  "><g transform="scale(0.0026246719160104987 0.0026246719160104987)"><path d="M1009 0 C442 0