834646" y="25.598425196850393" font-family="Roboto" font-size="16.0" text-anchor="middle" fill="#000000">Despite being red, Mars is actually a cold place. It’s full of iron oxide dust</text></g><g transform="translate(403.38582677165357 374.0)  "><rect width="153.22834645669292" height="103.05511811023622" rx="0" fill="none" stroke="none" stroke-width="1.0" stroke-linejoin="round"/><text x="76.61417322834646" y="25.598425196850393" font-family="Roboto" font-size="16.0" text-anchor="middle" fill="#000000">Jupiter is a gas giant and the biggest planet in the Solar System</text></g><g transform="translate(642.4619422572179 374.0)  "><rect width="153.22834645669292" height="103.05511811023622" rx="0" fill="none" stroke="none" stroke-width="1.0" stroke-linejoin="round"/><text x="76.61417322834646" y="25.598425196850393" font-family="Roboto" font-size="16.0" text-anchor="middle" fill="#000000">Mercury is the closest planet to the Sun and the smallest one</text></g><g transform="translate(372.86614173228344 118.78740157480316)  "><rect width="214.26771653543307" height="74.01574803149606" rx="0" fill="none" stroke="none" stroke-width="1.0" stroke-linejoin="round"/><text x="107.13385826771653" y="45.33333333333333" font-family="Fira Sans Extra Condensed" font-size="21.333333333333332" text-anchor="middle" fill="#000000">Jupiter</text></g><g transform="translate(611.9422572178478 118.78740157480316)  "><rect width="214.26771653543307" height="74.01574803149606" rx="0" fill="none" stroke="none" stroke-width="1.0" stroke-linejoin="round"/><text x="107.13385826771653" y="45.33333333333333" font-family="Fira Sans Extra Condensed" font-size="21.333333333333332" text-anchor="middle" fill="#000000">Mercury</text></g><g transform="translate(213.01658792650917 245.21595800524935) scale(1.4694993973483326 1.4883988343703236) translate(6837.790026246719 -277.87926509186354)"><g transform="translate(-6837.790026246719 277.87926509186354)  "><g transform="scale(0.0026246719160104987 0.00